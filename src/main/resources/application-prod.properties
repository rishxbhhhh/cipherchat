# Production profile — H2 file-based, creds from env vars
spring.datasource.url=jdbc:h2:file:/data/cipherchat;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${CIPHERCHAT_DB_USERNAME:cipherchat}
spring.datasource.password=${CIPHERCHAT_DB_PASSWORD:change-me-in-production}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
management.endpoints.web.exposure.include=health,info
spring.h2.console.enabled=false
