services:
  - type: web
    name: cipherchat
    runtime: docker
    repo: https://github.com/rishxbhhhh/cipherchat
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx350m -Xss256k -XX:+UseSerialGC -XX:MaxRAM=420m -XX:MaxMetaspaceSize=60m"
      - key: PORT
        value: "8080"
      # Secrets — set these in Render Dashboard: Environment → Environment Variables
      - key: CIPHERCHAT_MASTER_KEY
        sync: false
      - key: CIPHERCHAT_DB_USERNAME
        sync: false
      - key: CIPHERCHAT_DB_PASSWORD
        sync: false
      - key: CIPHERCHAT_ADMIN_EMAIL
        sync: false
      - key: CIPHERCHAT_ADMIN_PASSWORD
        sync: false
